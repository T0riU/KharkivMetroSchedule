<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<title>Kharkiv Metro</title>
<link rel="icon" href="img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div id="header">
  <div id="clock-wrap">
    <span id="clock">00:00:00</span>
    <span id="day-badge">будні</span>
  </div>
  <button id="settings-btn">⚙</button>
</div>

<div id="map-wrap"></div>

<div id="bottom-panel">
  <div class="panel-drag-area">
    <div class="panel-drag-handle"></div>
  </div>
  <div class="panel-inner">
    <div class="panel-header-row">
      <div class="station-name">
        <div class="line-dot" id="panel-dot"></div>
        <span id="panel-name"></span>
      </div>
      <button id="panel-close-btn" aria-label="Закрити">✕</button>
    </div>
    <div class="line-label" id="panel-line"></div>

    <div class="times-grid" id="times-grid"></div>

    <div id="route-section">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap">
        <button id="route-btn">Маршрут до іншої станції</button>
      </div>
      <div id="route-result"></div>
    </div>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-box">
    <h2 style="display:flex;justify-content:space-between;align-items:center">
  Налаштування
  <span style="color:#4a5280;font-size:13px;font-weight:400">@T0riU</span>
</h2>

    <div class="setting-section">Час між станціями</div>
    <div class="setting-row">
      <label>Синя лінія (сек)</label>
      <input type="number" id="s-blue" min="30" max="300" step="5">
    </div>
    <div class="setting-row">
      <label>Зелена лінія (сек)</label>
      <input type="number" id="s-green" min="30" max="300" step="5">
    </div>
    <div class="setting-row">
      <label>Червона лінія (сек)</label>
      <input type="number" id="s-red" min="30" max="300" step="5">
    </div>

    <div class="setting-section">Пересадки</div>
    <div class="setting-row">
      <label>Час пересадки (сек)</label>
      <input type="number" id="s-transfer" min="30" max="600" step="10">
    </div>

    <button id="settings-close">Закрити</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<!-- <script src="js/main.js"></script> -->
</body>
</html>
